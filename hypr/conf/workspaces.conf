$mon1 = DP-2
$mon2 = DP-4

workspace=1, monitor:$mon1
workspace=2, monitor:$mon2
workspace=3, monitor:$mon2

exec-once = discord
exec-once = spotify

windowrule {
	name = discord-workspace
	match:class = discord
	workspace = 2
}

windowrule {
	name = spotify-workspace
	match:class = Spotify
	workspace = 3
}
